name: Build game (Fabryka 1892)

# Buduje grę w Godot 4.6 na Windows i do przeglądarki po każdej zmianie w gra-fabryka/.
# Wyniki są dostępne jako artefakty (Actions → uruchomienie → Artifacts).
# Tag w formacie gra-v1.0 publikuje dodatkowo Release z paczkami do pobrania.
on:
  push:
    paths:
      - "gra-fabryka/**"
      - ".github/workflows/build-game.yml"
    tags:
      - "gra-v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.6"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot + export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-templates

      - name: Download Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p ~/godot ~/.local/share/godot/export_templates
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz -d /tmp/templates
          mv /tmp/templates/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Import project
        run: ~/godot/godot --headless --path gra-fabryka/godot --import || true

      - name: Headless simulation test (35 days)
        run: |
          ~/godot/godot --headless --path gra-fabryka/godot res://scenes/test_run.tscn --quit-after 3000 2>&1 | tee sim.log
          if grep -q "SCRIPT ERROR" sim.log; then echo "Błędy skryptów w symulacji"; exit 1; fi
          grep -q "== KONIEC" sim.log

      - name: Export Windows
        run: |
          mkdir -p export/windows
          ~/godot/godot --headless --path gra-fabryka/godot --export-release "Windows Desktop" "$PWD/export/windows/Fabryka1892.exe"
          cp gra-fabryka/README.md export/windows/CZYTAJ.md
          cd export && zip -r Fabryka1892-windows.zip windows

      - name: Export Web
        run: |
          mkdir -p export/web
          ~/godot/godot --headless --path gra-fabryka/godot --export-release "Web" "$PWD/export/web/index.html"
          cd export && zip -r Fabryka1892-web.zip web

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Fabryka1892-${{ github.sha }}
          path: |
            export/Fabryka1892-windows.zip
            export/Fabryka1892-web.zip
          retention-days: 30

      - name: Release (tag gra-v*)
        if: startsWith(github.ref, 'refs/tags/gra-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            export/Fabryka1892-windows.zip
            export/Fabryka1892-web.zip
          generate_release_notes: true
