name: Per-Anch – zdjęcia z Wikimedia Commons

# Pobiera na wolnych licencjach zdjęcia ścian świątyń i papirusów do Analizatora Ściany
# (środowisko sesji Claude nie ma dostępu do Wikimedia; runner GitHub ma).
# Uruchamiany pushem na gałąź roboczą po zmianie plików w per-anch/tools/.
# Tryb (search = podglądy kandydatów, fetch = wybrane pliki w pełnej jakości) odczytuje
# z per-anch/tools/commons-mode.txt. Commit bota nie uruchamia kolejnego biegu.
on:
  push:
    branches: [ccr-efb25f08-2kwscu]
    paths: ["per-anch/tools/**", ".github/workflows/per-anch-commons.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: per-anch-commons-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tryb
        id: mode
        run: echo "mode=$(tr -d '[:space:]' < per-anch/tools/commons-mode.txt)" >> "$GITHUB_OUTPUT"
      - name: Pobierz podglądy kandydatów
        if: steps.mode.outputs.mode == 'search'
        run: python per-anch/tools/fetch_commons.py search per-anch/tools/commons-queries.json per-anch/img/candidates 480
      - name: Pobierz wybrane zdjęcia
        if: steps.mode.outputs.mode == 'fetch'
        run: python per-anch/tools/fetch_commons.py fetch per-anch/tools/commons-chosen.json per-anch/img 1600
      - name: Zapisz w gałęzi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A per-anch/img
          git commit -m "Per-Anch: zdjęcia z Wikimedia Commons (${{ steps.mode.outputs.mode }}, automat)" || { echo "brak zmian"; exit 0; }
          git push
