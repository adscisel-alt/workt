<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pałac w Memfis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Widok z tarasu pałacu faraona w Memfis na starożytny Egipt: zbliżenia na Sakkarę, Gizę, Nil i świątynię Ptaha oraz warstwa magii bogów i zejście do Duat.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Noto+Sans+Egyptian+Hieroglyphs&display=swap">
<style>
/* Układ: pełnoekranowa scena (SVG z własnym zoomem) + wąska belka sterowania u góry,
   żetony miejsc u dołu i karta opisu z boku. Jeden świat kolorów: lapis, ochra, złoto, wapień. */
:root{
  --ink:#0b1026;        /* noc / tusz */
  --ink-2:#161c3a;      /* panele */
  --lapis:#1f4fa3;      /* lazuryt */
  --faience:#3fb8b0;    /* fajans — miejsca */
  --gold:#f2c14e;       /* złoto — bóstwa */
  --ochre:#c8782f;      /* ochra */
  --lime:#f1e6c8;       /* wapień — tekst */
  --lime-dim:#b8ad92;
  --font-display:'Marcellus', 'Palatino Linotype', 'Book Antiqua', Georgia, serif;
  --font-body:'Crimson Pro', Georgia, 'Times New Roman', serif;
  --font-glyph:'Noto Sans Egyptian Hieroglyphs', 'Segoe UI Historic', sans-serif;
  color-scheme: dark;
}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--lime);font-family:var(--font-body);font-size:17px;line-height:1.5;overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

#app{height:100%;display:flex;flex-direction:column}

/* belka */
.bar{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;
  padding-block:8px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  background:linear-gradient(180deg,#141a38,#0f1430);
  border-bottom:1px solid rgba(242,193,78,.35);
  position:relative;z-index:5;
}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;margin-right:auto}
.brand h1{font-family:var(--font-display);font-weight:400;font-size:1.15rem;margin:0;letter-spacing:.02em;white-space:nowrap}
.brand .glyph{font-family:var(--font-glyph);color:var(--gold);font-size:1.1rem;white-space:nowrap}
.ctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.seg{display:flex;border:1px solid rgba(241,230,200,.3);border-radius:999px;overflow:hidden}
.seg button{padding:4px 12px;font-family:var(--font-display);font-size:.85rem;letter-spacing:.04em;color:var(--lime-dim)}
.seg button[aria-pressed="true"]{background:var(--lapis);color:#fff}
.toggle{display:flex;align-items:center;gap:8px;padding:4px 12px;border:1px solid rgba(242,193,78,.5);border-radius:999px;font-family:var(--font-display);font-size:.85rem;letter-spacing:.04em;color:var(--gold)}
.toggle .sw{width:30px;height:16px;border-radius:999px;background:rgba(242,193,78,.25);position:relative;transition:background .25s}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--gold);transition:transform .25s}
.toggle[aria-pressed="true"] .sw{background:var(--gold)}
.toggle[aria-pressed="true"] .sw::after{transform:translateX(14px);background:var(--ink)}
.time{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.time label{font-family:var(--font-display);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--lime-dim)}
.time input{width:120px;accent-color:var(--gold)}
.time output{min-width:3.2em;font-family:var(--font-display);font-size:.95rem}
.ico{width:32px;height:32px;border-radius:50%;border:1px solid rgba(241,230,200,.3);font-family:var(--font-display);font-size:1.05rem;line-height:1;display:grid;place-items:center;color:var(--lime)}
.ico[aria-pressed="true"]{background:var(--gold);color:var(--ink);border-color:var(--gold)}

/* scena */
.stage{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;background:var(--ink);cursor:grab}
.stage.dragging{cursor:grabbing}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hs{cursor:pointer}
.hs .ring{fill:none;stroke-width:2;opacity:.9}
.hs .dot{stroke:#0b1026;stroke-width:1.5}
.hs.place .ring{stroke:var(--faience)}
.hs.place .dot{fill:var(--faience)}
.hs.god .ring{stroke:var(--gold)}
.hs.god .dot{fill:var(--gold)}
.hs text{font-family:var(--font-display);font-size:12px;fill:var(--lime);paint-order:stroke;stroke:#0b1026;stroke-width:3px;stroke-linejoin:round;letter-spacing:.03em}
.hs.god text{fill:#ffe8a3}
.hs.sel .ring{stroke-width:3;opacity:1}
.hs .halo{fill:none;stroke-width:1.5;opacity:.6}
.hs.place .halo{stroke:var(--faience)}
.hs.god .halo{stroke:var(--gold)}
@media (prefers-reduced-motion: no-preference){
  .hs .halo{animation:halo 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.9);opacity:0}}
  .boat{animation:drift 60s linear infinite}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-120px)}}
  .god-float{animation:float 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .spark{animation:spark 4s ease-in-out infinite}
  @keyframes spark{0%,100%{opacity:0}50%{opacity:1}}
  .flame{animation:flame .9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom center}
  @keyframes flame{from{transform:scaleY(.9) scaleX(1)}to{transform:scaleY(1.15) scaleX(.9)}}
}
#gods,#duatGods{transition:opacity .6s}
.hint{
  position:absolute;left:max(16px, env(safe-area-inset-left, 0px));top:12px;z-index:3;
  font-family:var(--font-display);font-size:.78rem;letter-spacing:.05em;color:var(--lime-dim);
  background:rgba(11,16,38,.6);padding:4px 10px;border-radius:999px;backdrop-filter:blur(4px);pointer-events:none;
  max-width:calc(100% - 140px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.magic-badge{
  position:absolute;right:max(16px, env(safe-area-inset-right, 0px));top:12px;z-index:3;
  font-family:var(--font-glyph);font-size:1.2rem;color:var(--gold);opacity:0;transition:opacity .6s;pointer-events:none;
  text-shadow:0 0 12px rgba(242,193,78,.8)
}
body.magic .magic-badge{opacity:1}

/* żetony */
.chips{
  position:absolute;left:0;right:0;bottom:0;z-index:4;
  display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;
  padding-block:10px calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  background:linear-gradient(0deg,rgba(11,16,38,.9),rgba(11,16,38,0));
  pointer-events:none
}
.chips button{
  pointer-events:auto;flex:0 0 auto;padding:5px 12px;border-radius:999px;
  border:1px solid rgba(63,184,176,.6);background:rgba(11,16,38,.75);
  font-family:var(--font-display);font-size:.82rem;letter-spacing:.03em;color:var(--lime);
  display:flex;align-items:center;gap:6px;backdrop-filter:blur(4px)
}
.chips button .g{font-family:var(--font-glyph);font-size:.9rem;color:var(--faience)}
.chips button.god{border-color:rgba(242,193,78,.7)}
.chips button.god .g{color:var(--gold)}
.chips button[aria-current="true"]{background:var(--faience);color:var(--ink);border-color:var(--faience)}
.chips button.god[aria-current="true"]{background:var(--gold);border-color:var(--gold)}
.chips button[aria-current="true"] .g{color:var(--ink)}

/* karta */
.card{
  position:absolute;z-index:6;
  top:52px;right:max(16px, env(safe-area-inset-right, 0px));width:min(380px, calc(100% - 32px));
  max-height:calc(100% - 120px);overflow:auto;
  background:linear-gradient(180deg,rgba(22,28,58,.96),rgba(14,18,42,.96));
  border:1px solid rgba(242,193,78,.45);border-radius:6px;
  box-shadow:0 20px 50px rgba(0,0,0,.5);
  padding:18px 20px 20px;
  transform:translateX(16px);opacity:0;pointer-events:none;transition:transform .3s,opacity .3s
}
.card.open{transform:none;opacity:1;pointer-events:auto}
.card .eyebrow{font-family:var(--font-display);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faience)}
.card.god .eyebrow{color:var(--gold)}
.card h2{font-family:var(--font-display);font-weight:400;font-size:1.45rem;margin:4px 0 2px;line-height:1.15;text-wrap:balance}
.card .glyph{font-family:var(--font-glyph);font-size:1.5rem;color:var(--gold);line-height:1.3;margin-bottom:8px;letter-spacing:.04em}
.card .translit{font-style:italic;color:var(--lime-dim);font-size:.95rem;margin-bottom:10px}
.card p{margin:0 0 10px;max-width:60ch}
.card .facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:12px 0 0;padding-top:12px;border-top:1px solid rgba(241,230,200,.15);font-size:.95rem}
.card .facts dt{font-family:var(--font-display);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--lime-dim);padding-top:3px}
.card .facts dd{margin:0}
.card .heka{margin-top:12px;padding:10px 12px;border-left:3px solid var(--gold);background:rgba(242,193,78,.08);font-size:.97rem}
.card .heka b{font-family:var(--font-display);font-weight:400;color:var(--gold);letter-spacing:.06em;font-size:.78rem;text-transform:uppercase;display:block;margin-bottom:2px}
.card .close{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;color:var(--lime-dim);font-size:1.2rem;line-height:1}
.card .close:hover{background:rgba(255,255,255,.08);color:var(--lime)}
.card .go{margin-top:12px;padding:6px 14px;border:1px solid var(--gold);border-radius:999px;color:var(--gold);font-family:var(--font-display);font-size:.85rem;letter-spacing:.05em}

@media (max-width:640px){
  .bar{gap:6px 10px}
  .brand h1{font-size:1rem}
  .time input{width:90px}
  .card{top:auto;bottom:0;right:0;left:0;width:100%;max-height:52%;border-radius:12px 12px 0 0;transform:translateY(20px);
    padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px));
    padding-bottom:calc(20px + env(safe-area-inset-bottom, 0px))}
  .card.open{transform:none}
  .chips{bottom:0}
  body.card-open .chips{display:none}
}
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="brand">
      <span class="glyph" aria-hidden="true">𓉐𓉻 𓊅𓌉𓊖</span>
      <h1>Pałac faraona w Memfis</h1>
    </div>
    <div class="ctl">
      <div class="seg" role="group" aria-label="Scena">
        <button id="sceneMemfis" aria-pressed="true">Taras pałacu</button>
        <button id="sceneDuat" aria-pressed="false">Duat</button>
      </div>
      <button id="magic" class="toggle" aria-pressed="false"><span class="sw" aria-hidden="true"></span>Świat bogów</button>
      <div class="time">
        <label for="time">Pora</label>
        <input id="time" type="range" min="0" max="24" step="0.1" value="17.4" aria-label="Pora dnia">
        <output id="timeOut" for="time">17:24</output>
        <button id="play" class="ico" aria-pressed="false" title="Bieg słońca" aria-label="Bieg słońca">▶</button>
      </div>
      <div class="ctl" role="group" aria-label="Zbliżenie">
        <button id="zoomOut" class="ico" aria-label="Oddal">−</button>
        <button id="zoomIn" class="ico" aria-label="Zbliż">+</button>
        <button id="zoomReset" class="ico" aria-label="Wróć na taras" title="Wróć na taras">⌂</button>
      </div>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="hint" id="hint">Przeciągnij, by się rozejrzeć · kółko lub szczypnięcie: zbliżenie</div>
    <div class="magic-badge" aria-hidden="true">𓎛𓂓𓄿 𓋹 𓂀</div>

    <!-- SCENA 1: widok z tarasu pałacu -->
    <svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="none" aria-label="Widok z tarasu pałacu w Memfis na Egipt">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop id="sky0" offset="0" stop-color="#2c5aa8"/>
          <stop id="sky1" offset=".55" stop-color="#d78c4e"/>
          <stop id="sky2" offset="1" stop-color="#f6c67a"/>
        </linearGradient>
        <radialGradient id="sunGlow"><stop offset="0" stop-color="#fff5c0" stop-opacity=".9"/><stop offset=".35" stop-color="#ffd27a" stop-opacity=".45"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
        <radialGradient id="torchGlow"><stop offset="0" stop-color="#ffb347" stop-opacity=".7"/><stop offset="1" stop-color="#ff8c2a" stop-opacity="0"/></radialGradient>
        <linearGradient id="nile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f86b8"/><stop offset="1" stop-color="#2b5f8e"/></linearGradient>
        <linearGradient id="desertFar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9b47a"/><stop offset="1" stop-color="#c9a066"/></linearGradient>
        <linearGradient id="desertNear" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfa264"/><stop offset="1" stop-color="#b98a4c"/></linearGradient>
        <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b79a6a"/><stop offset="1" stop-color="#8c7046"/></linearGradient>
        <linearGradient id="column" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a6a3e"/><stop offset=".3" stop-color="#e3c78f"/><stop offset=".7" stop-color="#d4b57a"/><stop offset="1" stop-color="#7a5c34"/></linearGradient>
        <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <filter id="softglow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <pattern id="floorTiles" width="80" height="40" patternUnits="userSpaceOnUse"><rect width="80" height="40" fill="none"/><path d="M0 0 H80 M0 20 H80 M40 0 V20 M0 20 V40 M80 20 V40" stroke="#6f5636" stroke-width="1.2" opacity=".6"/></pattern>
      </defs>

      <!-- niebo -->
      <rect x="-3000" y="-3000" width="8000" height="3435" fill="url(#sky)"/>
      <g id="stars" opacity="0"></g>
      <g id="nutGroup" opacity="0"></g>
      <g id="sunGroup"><circle id="sunHalo" r="260" fill="url(#sunGlow)"/><circle id="sun" r="42" fill="#fff1b8"/></g>
      <g id="moonGroup" opacity="0"><circle r="26" fill="#f4efdc"/><circle cx="-9" cy="-4" r="22" id="moonShade" fill="#2a2f55" opacity="0"/></g>
      <g id="birds" fill="none" stroke="#2a2a3a" stroke-width="2" opacity=".7"></g>

      <!-- ląd -->
      <g id="land">
        <!-- mgiełka delty daleko na północy (prawo) -->
        <rect x="900" y="380" width="2100" height="60" fill="#e8ddc0" opacity=".45"/>
        <!-- daleki płaskowyż pustynny -->
        <path d="M-3000 440 L-200 440 L80 412 L260 420 L400 404 L640 418 L820 426 L1000 416 L1180 420 L1400 416 L1600 424 L5000 424 L5000 520 L-3000 520Z" fill="url(#desertFar)"/>
        <g id="farPyramids"></g>
        <!-- bliższa skarpa z Sakkarą -->
        <path d="M-3000 470 L-300 470 L-100 458 L200 452 L480 456 L700 466 L900 472 L1100 476 L1300 470 L1500 468 L5000 470 L5000 600 L-3000 600Z" fill="url(#desertNear)"/>
        <g id="nearPyramids"></g>
        <!-- Nil: wstęga od horyzontu na północy w prawo i w dół -->
        <path id="nilePath" d="M1300 430 C1320 470 1380 500 1460 540 C1560 590 1640 640 1700 720 L1900 800 L1900 430Z" fill="url(#nile)"/>
        <path d="M1296 432 C1318 472 1378 502 1458 542 C1558 592 1638 642 1698 722" fill="none" stroke="#9fc9e8" stroke-width="2" opacity=".5"/>
        <g id="nileShimmer" fill="#dff1ff" opacity=".35"></g>
        <!-- pola -->
        <g id="fields"></g>
        <!-- miasto -->
        <g id="city"></g>
        <!-- palmy -->
        <g id="palms"></g>
        <!-- łodzie -->
        <g id="boats"></g>
        <!-- noc nad lądem -->
        <rect id="nightLand" x="-3000" y="380" width="8000" height="2600" fill="#060818" opacity="0"/>
      </g>

      <!-- bogowie (warstwa magii) -->
      <g id="gods" opacity="0"></g>

      <!-- pałac: taras na pierwszym planie -->
      <g id="palace">
        <rect x="-3000" y="640" width="8000" height="3000" fill="url(#floor)"/>
        <rect x="-3000" y="640" width="8000" height="3000" fill="url(#floorTiles)"/>
        <!-- balustrada -->
        <rect x="-3000" y="618" width="8000" height="24" fill="#d9bf8a"/>
        <rect x="-3000" y="640" width="8000" height="8" fill="#7a5c34" opacity=".5"/>
        <g id="balusters"></g>
        <!-- kolumny -->
        <g id="columns"></g>
        <!-- strop (widoczny po przesunięciu w górę) -->
        <g id="ceiling"></g>
        <!-- pochodnie -->
        <g id="torches"></g>
        <!-- tron i stolik -->
        <g id="throne"></g>
      </g>

      <g id="markers"></g>
    </svg>

    <!-- SCENA 2: Duat -->
    <svg id="duat" viewBox="0 0 1600 900" preserveAspectRatio="none" aria-label="Duat, kraina nocy i sąd Ozyrysa" hidden>
      <defs>
        <linearGradient id="duatSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#03040c"/><stop offset=".6" stop-color="#0b0f2a"/><stop offset="1" stop-color="#1b1033"/></linearGradient>
        <linearGradient id="nightRiver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c2f6b"/><stop offset="1" stop-color="#0a1232"/></linearGradient>
        <radialGradient id="iaru"><stop offset="0" stop-color="#ffe9a8" stop-opacity=".55"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
        <radialGradient id="fire"><stop offset="0" stop-color="#ffd57a" stop-opacity=".9"/><stop offset="1" stop-color="#ff6a1a" stop-opacity="0"/></radialGradient>
        <pattern id="judges" width="36" height="60" patternUnits="userSpaceOnUse"><path d="M18 8 a6 6 0 1 1 0 .1 M12 20 h12 l4 30 h-20z" fill="#4a3d2a"/><circle cx="18" cy="12" r="6" fill="#4a3d2a"/></pattern>
      </defs>
      <rect x="-3000" y="-3000" width="8000" height="8000" fill="url(#duatSky)"/>
      <g id="duatStars"></g>
      <!-- Pola Iaru (raj) w oddali -->
      <g id="iaruGroup"></g>
      <!-- sala Dwóch Prawd: posadzka -->
      <path d="M-3000 560 L5000 560 L5000 3000 L-3000 3000Z" fill="#17122b"/>
      <path d="M-3000 560 L5000 560 L5000 575 L-3000 575Z" fill="#3a2d55"/>
      <!-- rzeka nocy na dole -->
      <path d="M-3000 700 C 200 680, 600 740, 1000 710 C 1300 690, 1500 730, 5000 700 L5000 3000 L-3000 3000Z" fill="url(#nightRiver)"/>
      <g id="duatScene"></g>
      <g id="duatGods" opacity="1"></g>
      <g id="duatMarkers"></g>
    </svg>

    <nav class="chips" id="chips" aria-label="Miejsca i bóstwa"></nav>

    <aside class="card" id="card" aria-live="polite">
      <button class="close" id="cardClose" aria-label="Zamknij">×</button>
      <div class="eyebrow" id="cEyebrow"></div>
      <h2 id="cTitle"></h2>
      <div class="glyph" id="cGlyph"></div>
      <div class="translit" id="cTranslit"></div>
      <div id="cBody"></div>
      <dl class="facts" id="cFacts"></dl>
      <div class="heka" id="cHeka"></div>
      <button class="go" id="cGo" hidden></button>
    </aside>
  </main>
</div>

<script>
(function(){
'use strict';
const W=1600, H=900, HORIZON=430;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const stage=$('stage'), sceneSvg=$('scene'), duatSvg=$('duat');

/* ------------------------------------------------------------------ */
/* Generator sylwetek bóstw (profil jak na malowidłach grobowych)      */
/* ------------------------------------------------------------------ */
const WIG='#1b2140';
function fig(o){
  const s=o.skin||'#b5542a', k=o.kilt||'#f3e9c8', gold='#f0b73a';
  let p='';
  // laska / insygnia (za postacią)
  if(o.item==='was') p+=`<path d="M14 36 L20 152" stroke="${gold}" stroke-width="3.5" stroke-linecap="round"/><path d="M8 34 Q14 26 22 34" fill="none" stroke="${gold}" stroke-width="3.5" stroke-linecap="round"/><path d="M14 152 l-5 6 M20 152 l5 6" stroke="${gold}" stroke-width="3"/>`;

function god(id,x,y,sc,o){
  const flip=o.flip?`scale(-1,1) translate(-100,0)`:'';
  return `<g class="godfig" data-god="${id}" transform="translate(${x},${y}) scale(${sc})" filter="url(#glow)" opacity=".92"><g class="god-float"><g transform="${flip}">${fig(o)}</g></g></g>`;
}

function pyramid(x,base,w,h,fill,shade){
  return `<path d="M${x-w/2} ${base} L${x} ${base-h} L${x+w/2} ${base}Z" fill="${fill}"/><path d="M${x} ${base-h} L${x+w/2} ${base} L${x} ${base}Z" fill="${shade}"/>`;
}
function stepPyramid(x,base,w,h,steps,fill,shade){
  let s='';
  for(let i=0;i<steps;i++){
    const f=1-i/steps, ww=w*f, hh=h/steps, y=base-i*hh;
    s+=`<rect x="${x-ww/2}" y="${y-hh}" width="${ww}" height="${hh}" fill="${fill}"/><rect x="${x}" y="${y-hh}" width="${ww/2}" height="${hh}" fill="${shade}"/>`;
  }
  return s;
}
function palm(x,y,s){
  let f='';
  for(let i=0;i<6;i++){
    const a=-90+(i-2.5)*32, r=a*Math.PI/180, ex=Math.cos(r)*26, ey=Math.sin(r)*26;
    f+=`<path d="M0 0 Q${ex*.6} ${ey*.6-8} ${ex} ${ey+10}" stroke="#2f6b3a" stroke-width="4" stroke-linecap="round" fill="none"/>`;
  }
  return `<g transform="translate(${x},${y}) scale(${s})"><path d="M-3 0 Q2 -30 0 -60" stroke="#6b4a2a" stroke-width="5" fill="none" stroke-linecap="round"/><g transform="translate(0,-60)">${f}<circle r="4" fill="#8a5a2a"/></g></g>`;
}
function house(x,y,w,h,c){ return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/><rect x="${x+w*.4}" y="${y+h*.45}" width="${w*.2}" height="${h*.55}" fill="#5a4328"/><rect x="${x}" y="${y}" width="${w}" height="3" fill="#8a6a40"/>`; }
function boat(x,y,s,sail){
  return `<g transform="translate(${x},${y}) scale(${s})"><g class="boat"><path d="M-40 0 Q-46 -14 -34 -16 L34 -16 Q50 -14 44 2 Q0 10 -40 0Z" fill="#7a4e24"/><path d="M-34 -4 H38" stroke="#c9a066" stroke-width="2"/>${sail?`<path d="M0 -16 V-70" stroke="#5a3a1a" stroke-width="3"/><path d="M2 -66 L36 -28 L2 -20Z" fill="#f3e9c8"/>`:`<path d="M-20 -16 l-6 -18 M-8 -16 l-6 -18 M4 -16 l-6 -18 M16 -16 l-6 -18" stroke="#c9a066" stroke-width="2"/>`}</g></g>`;
}
function seeded(n){ let s=n; return ()=>{ s=(s*9301+49297)%233280; return s/233280; }; }

const SKY=[
 [0,['#070a1e','#0d1538','#1a2550']],
 [4.5,['#070a1e','#121a40','#2a2a5a']],
 [6,['#1f2f6a','#b06a4a','#f0b36a']],
 [7.5,['#2a62b8','#7fb3e2','#e6c98f']],
 [11,['#1f66c6','#6aa9e2','#cfe3f0']],
 [15,['#2461c0','#79aee0','#d9e3ea']],
 [17.4,['#2c5aa8','#d78c4e','#f6c67a']],
 [19,['#1a2355','#8b3f4a','#e07a3a']],
 [20.5,['#0a0f2e','#1e2252','#3a2f55']],
 [24,['#070a1e','#0d1538','#1a2550']],
];
function hex(c){ return [1,3,5].map(i=>parseInt(c.slice(i,i+2),16)); }
function mix(a,b,t){ const A=hex(a),B=hex(b); return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join(''); }
function skyAt(t){
  for(let i=0;i<SKY.length-1;i++){ const [t0,c0]=SKY[i],[t1,c1]=SKY[i+1]; if(t>=t0&&t<=t1){ const u=(t-t0)/(t1-t0); return c0.map((c,j)=>mix(c,c1[j],u)); } }
  return SKY[0][1];
}
function nightFactor(t){ if(t<=4.8||t>=20) return 1; if(t>=7&&t<=17.8) return 0; if(t<7) return 1-(t-4.8)/2.2; return (t-17.8)/2.2; }
/* Taras patrzy na zachód: południe jest po lewej, północ po prawej.
   Słońce wschodzi za plecami (lewy skraj), góruje po lewej i zachodzi przed nami. */
function sunPos(t){ const f=(t-6)/12; return {x:60+f*760, y:HORIZON-Math.sin(Math.PI*f)*470}; }
function moonPos(t){ const f=(((t+6)%24))/12; return {x:60+f*760, y:HORIZON-Math.sin(Math.PI*f)*440}; }
let T=17.4;
function setTime(t){
  T=t;
  const [a,b,c]=skyAt(t);
  $('sky0').setAttribute('stop-color',a); $('sky1').setAttribute('stop-color',b); $('sky2').setAttribute('stop-color',c);
  const n=nightFactor(t);
  $('stars').setAttribute('opacity',n*.95);
  $('nightLand').setAttribute('opacity',n*.62);
  const day=t>5.3&&t<18.7;
  const sp=sunPos(t);
  $('sunGroup').setAttribute('transform',`translate(${sp.x},${sp.y})`);
  $('sunGroup').setAttribute('opacity',day?1:0);
  const low=Math.max(0,1-Math.abs(t-12)/6);
  $('sun').setAttribute('fill',mix('#ffb347','#fff1b8',Math.min(1,low*1.6)));
  const mp=moonPos(t);
  $('moonGroup').setAttribute('transform',`translate(${mp.x},${mp.y})`);
  $('moonGroup').setAttribute('opacity',n);
  const [ta,tb,tc]=[a,b,c]; $('moonShade').setAttribute('fill',tb); $('moonShade').setAttribute('opacity',.85);
  document.querySelectorAll('.torchGlow').forEach(e=>e.setAttribute('opacity',n*.9));
  $('birds').setAttribute('opacity',(1-n)*.7);
  const ra=$('raFig'); if(ra){ ra.setAttribute('transform',`translate(${sp.x},${sp.y+40})`); ra.setAttribute('opacity',day?.95:0); }
  $('nutGroup').setAttribute('opacity',magic?n:0);
  const hh=Math.floor(t)%24, mm=Math.round((t-Math.floor(t))*60)%60;
  $('timeOut').value=`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
  $('time').value=t;
  renderMarkers();
}

/* ------------------------------------------------------------------ */
/* Zoom / przesuwanie                                                  */
/* ------------------------------------------------------------------ */
let scene='memfis';
let vb={x:0,y:0,w:W,h:H};
const MINW=150, MAXW=1700;
function aspect(){ return stage.clientHeight/Math.max(1,stage.clientWidth); }
function clampVB(v){
  v.w=Math.min(MAXW,Math.max(MINW,v.w)); v.h=v.w*aspect();
  const cx=v.x+v.w/2, cy=v.y+v.h/2;
  const ccx=Math.min(1700,Math.max(-100,cx));
  const minCy=scene==='memfis'?-620:-200, maxCy=scene==='memfis'?1100:950;
  const ccy=Math.min(maxCy,Math.max(minCy,cy));
  v.x=ccx-v.w/2; v.y=ccy-v.h/2; return v;
}
function currentSvg(){ return scene==='memfis'?sceneSvg:duatSvg; }
function render(){
  clampVB(vb);
  currentSvg().setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  renderMarkers();
}
function fitInitial(){
  const a=aspect();
  if(a>1){ vb.w=Math.min(MAXW,1200); } else { vb.w=W; }
  vb.h=vb.w*a; vb.x=W/2-vb.w/2; vb.y=(scene==='memfis'?420:450)-vb.h/2; render();
}
let anim=null;
function flyTo(cx,cy,w,ms=800){
  if(anim) cancelAnimationFrame(anim);
  const from={...vb}; const to=clampVB({x:cx-w/2,y:cy-(w*aspect())/2,w,h:w*aspect()});
  if(reduced||ms===0){ vb=to; render(); return; }
  const t0=performance.now();
  const step=now=>{ let u=Math.min(1,(now-t0)/ms); u=u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
    vb={x:from.x+(to.x-from.x)*u,y:from.y+(to.y-from.y)*u,w:from.w+(to.w-from.w)*u,h:from.h+(to.h-from.h)*u};
    render(); if(u<1) anim=requestAnimationFrame(step); else anim=null; };
  anim=requestAnimationFrame(step);
}
function zoomAt(px,py,factor){
  const r=stage.getBoundingClientRect();
  const wx=vb.x+(px-r.left)/r.width*vb.w, wy=vb.y+(py-r.top)/r.height*vb.h;
  const nw=Math.min(MAXW,Math.max(MINW,vb.w*factor)); const k=nw/vb.w;
  vb={x:wx-(wx-vb.x)*k, y:wy-(wy-vb.y)*k, w:nw, h:vb.h*k}; render();
}
const ptrs=new Map(); let dragStart=null, moved=false, pinch=null;
stage.addEventListener('pointerdown',e=>{
  if(e.target.closest('.card,.chips,.hint')) return;
  stage.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(anim){ cancelAnimationFrame(anim); anim=null; }
  if(ptrs.size===1){ dragStart={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y}; moved=false; stage.classList.add('dragging'); }
  if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y),w:vb.w,mx:(a.x+b.x)/2,my:(a.y+b.y)/2}; dragStart=null; }
});
stage.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const r=stage.getBoundingClientRect();
  if(ptrs.size===2&&pinch){
    const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    const nw=Math.min(MAXW,Math.max(MINW,pinch.w*pinch.d/d)); const k=nw/vb.w;
    const wx=vb.x+(pinch.mx-r.left)/r.width*vb.w, wy=vb.y+(pinch.my-r.top)/r.height*vb.h;
    vb={x:wx-(wx-vb.x)*k-(mx-pinch.mx)/r.width*nw, y:wy-(wy-vb.y)*k-(my-pinch.my)/r.height*nw*aspect(), w:nw, h:nw*aspect()};
    pinch.mx=mx; pinch.my=my; moved=true; render(); return;
  }
  if(dragStart){
    const dx=e.clientX-dragStart.x, dy=e.clientY-dragStart.y;
    if(Math.hypot(dx,dy)>4) moved=true;
    vb.x=dragStart.vx-dx/r.width*vb.w; vb.y=dragStart.vy-dy/r.height*vb.h; render();
  }
});
function endPtr(e){
  ptrs.delete(e.pointerId); if(ptrs.size<2) pinch=null;
  if(ptrs.size===0){ stage.classList.remove('dragging'); dragStart=null; }
  else if(ptrs.size===1){ const p=[...ptrs.values()][0]; dragStart={x:p.x,y:p.y,vx:vb.x,vy:vb.y}; }
}
stage.addEventListener('pointerup',endPtr); stage.addEventListener('pointercancel',endPtr);
stage.addEventListener('wheel',e=>{ e.preventDefault(); zoomAt(e.clientX,e.clientY,Math.pow(1.0016,e.deltaY)); },{passive:false});
stage.addEventListener('dblclick',e=>{ if(e.target.closest('.card,.chips')) return; const r=stage.getBoundingClientRect(); const wx=vb.x+(e.clientX-r.left)/r.width*vb.w, wy=vb.y+(e.clientY-r.top)/r.height*vb.h; flyTo(wx,wy,vb.w*.5); });
$('zoomIn').onclick=()=>flyTo(vb.x+vb.w/2,vb.y+vb.h/2,vb.w*.6,400);
$('zoomOut').onclick=()=>flyTo(vb.x+vb.w/2,vb.y+vb.h/2,vb.w/.6,400);
$('zoomReset').onclick=()=>{ closeCard(); flyTo(W/2,scene==='memfis'?420:450,aspect()>1?W:1200,700); };
addEventListener('resize',()=>{ render(); });

function posOf(it){
  if(it.dyn==='sun'){ const d=T>5.3&&T<18.7; const p=d?sunPos(T):{x:1500,y:430}; return {x:p.x,y:p.y-(d?110:0)}; }

}

}
$('chips').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) select(b.dataset.id,true); });
function select(id,fly){
  const it=items().find(x=>x.id===id); if(!it) return;
  if(it.id==='ra'&&!(T>5.3&&T<18.7)){ switchScene('duat'); setTimeout(()=>select('barka',true),50); return; }
  selected=it;
  const p=posOf(it);
  if(fly) flyTo(p.x,p.y,it.zoom);
  const card=$('card'); card.classList.toggle('god',it.kind==='god'); card.classList.add('open'); document.body.classList.add('card-open');
  $('cEyebrow').textContent=it.kind==='god'?(scene==='duat'?'Bóstwo · Duat':'Bóstwo · świat magii'):(scene==='duat'?'Duat · kraina nocy':'Miejsce · Egipt Starego Państwa');
  $('cTitle').textContent=it.name; $('cGlyph').textContent=it.glyph; $('cTranslit').textContent=it.translit;
  $('cBody').innerHTML=it.body;
  $('cFacts').innerHTML=it.facts.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('');
  $('cHeka').innerHTML=`<b>Heka · magia</b>${it.heka}`;
  const go=$('cGo');
  if(scene==='memfis'&&(it.id==='sakkara'||it.id==='osiris'||it.id==='anubis'||it.id==='heka')){ go.hidden=false; go.textContent='Zejdź do Duat →'; go.onclick=()=>{ switchScene('duat'); setTimeout(()=>select('waga',true),50); }; }
  else if(scene==='duat'&&it.id==='iaru'){ go.hidden=false; go.textContent='Wróć na taras pałacu →'; go.onclick=()=>switchScene('memfis'); }
  else go.hidden=true;
  renderMarkers(); renderChips();
  card.scrollTop=0;
}
function closeCard(){ selected=null; $('card').classList.remove('open'); document.body.classList.remove('card-open'); renderMarkers(); renderChips(); }
$('cardClose').onclick=closeCard;

/* sceny i magia */
function switchScene(s){
  if(scene===s) return; scene=s; closeCard();
  sceneSvg.toggleAttribute('hidden',s!=='memfis'); duatSvg.toggleAttribute('hidden',s!=='duat');
  $('sceneMemfis').setAttribute('aria-pressed',s==='memfis'); $('sceneDuat').setAttribute('aria-pressed',s==='duat');
  $('hint').textContent=s==='duat'?'Duat: noc, przez którą płynie Ra. Kliknij znaczniki, by poznać sąd Ozyrysa':'Przeciągnij, by się rozejrzeć · kółko lub szczypnięcie: zbliżenie';
  fitInitial(); renderChips();
}
$('sceneMemfis').onclick=()=>switchScene('memfis');
$('sceneDuat').onclick=()=>switchScene('duat');
$('magic').onclick=()=>{
  magic=!magic; $('magic').setAttribute('aria-pressed',magic); document.body.classList.toggle('magic',magic);
  $('gods').setAttribute('opacity',magic?1:0); $('gods').style.pointerEvents=magic?'':'none';
  setTime(T); renderChips();
  if(selected&&selected.kind==='god'&&!magic) closeCard();
};
$('time').addEventListener('input',e=>{ stopPlay(); setTime(parseFloat(e.target.value)); renderChips(); });
let playing=false, playRaf=null, lastTs=0;
function stopPlay(){ playing=false; $('play').setAttribute('aria-pressed','false'); $('play').textContent='▶'; if(playRaf) cancelAnimationFrame(playRaf); }
$('play').onclick=()=>{
  if(playing){ stopPlay(); return; }
  playing=true; $('play').setAttribute('aria-pressed','true'); $('play').textContent='❚❚'; lastTs=performance.now();
  const step=now=>{ if(!playing) return; const dt=(now-lastTs)/1000; lastTs=now; setTime((T+dt*0.5)%24); playRaf=requestAnimationFrame(step); };
  playRaf=requestAnimationFrame(step);
};

/* start */
buildScene(); buildDuat();
$('gods').style.pointerEvents='none';
fitInitial(); setTime(17.4); renderChips();
try{ if(localStorage.getItem('memfis-magic')==='1'){ $('magic').click(); } }catch(e){}
$('magic').addEventListener('click',()=>{ try{ localStorage.setItem('memfis-magic',magic?'1':'0'); }catch(e){} });
})();
</script>
